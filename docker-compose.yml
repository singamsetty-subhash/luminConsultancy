version: '3.8'

services:
  web:
    build: .
    container_name: lumin_site_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: lumindb
      DB_USER: root
      DB_PASS: root
      APP_ENV: production
      ENQUIRY_TO: ceo.lumin@gmail.com
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: lumin_site_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lumindb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:

