version: '3.8'

services:
  web:
    build: .
    container_name: lumin_site_app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8080}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-lumindb}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-root}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      DATABASE_URL: ${DATABASE_URL:-mysql://root:root@localhost:3306/lumindb}
      APP_ENV: ${APP_ENV:-development}
      ENQUIRY_TO: ${ENQUIRY_TO:-ceo.lumin@gmail.com}
